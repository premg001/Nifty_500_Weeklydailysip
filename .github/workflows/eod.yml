name: EOD scan
on:
  schedule:
    - cron: "30 11 * * 1-5"   # 17:00 IST, Mon-Fri, after NSE close
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "eod-bot"
          git config user.email "eod-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "EOD scan $(date -u +%F)" && git push)
